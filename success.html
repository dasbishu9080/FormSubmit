<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Submission Successful</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #eef4ff, #f8faff);
        }

        .card {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 45px 30px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 15px 45px rgba(0,0,0,.10);
        }

        .icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #dcfce7;
            color: #16a34a;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
        }

        h1 {
            font-size: 25px;
            color: #111827;
            margin-bottom: 10px;
        }

        p {
            color: #6b7280;
            font-size: 15px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="icon">✓</div>

        <h1>
            Thanks for submitting your interest
        </h1>

        <p>
            Your response has been successfully submitted.
            Thank you for sharing your interest.
        </p>

    </div>

</body>
</html>
